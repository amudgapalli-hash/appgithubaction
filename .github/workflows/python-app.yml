name: Python CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    #strategy:
      #matrix:
      #  python-version: [3.8, 3.9, 3.10, 3.11]
    steps:

    # Step 2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'

      #Step 3
    - name: Install dependencies
      run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

    # Step 4
    - name: Run tests
      run: pytest
